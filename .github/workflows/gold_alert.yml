name: Gold Price Alert

on:
  schedule:
    # GitHub Actions cron 使用 UTC 时区；*/15 表示每 15 分钟一次（24 小时不间断）
    - cron: "*/15 * * * *"
  workflow_dispatch:  # 允许手动触发测试

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 从上一次运行恢复 state.json（冷却 / 每日播报幂等）
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: gold-state-${{ github.run_id }}
          restore-keys: |
            gold-state-

      - name: Run gold_alert.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MONITOR_SECONDS: "780"   # 单次 Run 内连续监测 13 分钟
          MONITOR_INTERVAL: "60"   # 每 60 秒抓一次价
        run: python gold_alert.py

      # 保存本次 state.json 供后续 Run 恢复
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: gold-state-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-logs-${{ github.run_id }}
          path: logs/run.log
          retention-days: 7
