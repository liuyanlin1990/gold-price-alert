name: Gold Price Alert

on:
  schedule:
    # 注意：GitHub Actions cron 是 UTC 时区，北京时间 = UTC + 8
    # */15 表示每 15 分钟运行一次（24 小时不间断）
    - cron: "*/15 * * * *"
  workflow_dispatch:  # 允许手动触发测试

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 从上一次运行恢复 state.json（实现冷却/每日播报幂等性）
      - name: Restore state
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gold-state
          path: .

      - name: Run gold_alert.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python gold_alert.py

      # 上传 state.json 供下次运行恢复（保留 14 天）
      - name: Upload state
        uses: actions/upload-artifact@v4
        with:
          name: gold-state
          path: state.json
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-logs
          path: logs/run.log
          retention-days: 7
